# Cloudflare Workers への自動デプロイ
#
# 発火条件:
#   - main への push（.md だけの変更は除く）
#   - 手動実行（Actions タブ → Run workflow。ブランチを選べる）
#
# 必要な登録（リポジトリ Settings → Secrets and variables → Actions → Secrets）:
#   CLOUDFLARE_API_TOKEN               … Cloudflare ダッシュボードで発行（docs/cloudflare-migration.md 3-3 参照）
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY … Stripe の公開可能キー（無いと決済ボタンが静かに壊れるため必須チェックあり)
#   NEXT_PUBLIC_SURVEY_FORM_URL        … アンケートフォームURL（任意）
#
# 注意: main へのマージは「切替当日」の操作。Vercel も main を見ているため、
#       マージすると両方にデプロイされる。手順は docs/cloudflare-migration.md を参照。

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 必須シークレットの確認
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_PK: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          ok=1
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN が未登録です（Settings → Secrets and variables → Actions）"
            ok=0
          fi
          if [ -z "$STRIPE_PK" ]; then
            echo "::error::NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY が未登録です。無いままビルドすると決済ボタンが静かに壊れます"
            ok=0
          fi
          [ "$ok" = "1" ] || exit 1

      - name: 依存をインストール
        run: npm ci

      - name: ビルド（OpenNext for Cloudflare）
        run: npm run cf:build
        env:
          # NEXT_PUBLIC_ 系はビルド時に埋め込まれる。ここに無い値は本番に入らない
          NEXT_PUBLIC_SITE_URL: https://ando-seika.com
          NEXT_PUBLIC_URL: https://ando-seika.com
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SURVEY_FORM_URL: ${{ secrets.NEXT_PUBLIC_SURVEY_FORM_URL }}

      - name: デプロイ（populateCache + wrangler deploy）
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
