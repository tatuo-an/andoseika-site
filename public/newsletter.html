<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>メール登録 | 安藤青果</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #faf8f4; color: #333; margin: 0; padding: 24px 16px; }
    main { max-width: 480px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 28px 24px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p.lead { font-size: .95rem; color: #555; margin: 0 0 20px; line-height: 1.7; }
    label { display: block; font-size: .85rem; margin-bottom: 6px; }
    input[type="email"] { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 14px; }
    button { width: 100%; padding: 12px; font-size: 1rem; border: 0; border-radius: 8px; background: #e8a33d; color: #fff; cursor: pointer; margin-top: 14px; }
    button:disabled { opacity: .6; }
    #rondo-status { font-size: .9rem; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>あんどうのメール登録</h1>
    <p class="lead">鳥取で農業と養蜂をやっている安藤です。メールでお便りをお届けします。いつでも解除できます。</p>
    <form id="rondo-subscribe">
      <label for="rondo-email">メールアドレス</label>
      <input
        id="rondo-email"
        name="email"
        type="email"
        inputmode="email"
        autocomplete="email"
        spellcheck="false"
        required
      >
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEPnyoSbgFfPjR-r"></div>
      <div aria-hidden="true" style="position:absolute;left:-10000px">
        <label for="rondo-website">Website</label>
        <input id="rondo-website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit">登録確認メールを受け取る</button>
      <p id="rondo-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    (() => {
      const form = document.getElementById('rondo-subscribe');
      const status = document.getElementById('rondo-status');
      const button = form.querySelector('button[type="submit"]');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const cfToken = data.get('cf-turnstile-response');
        if (!cfToken) {
          status.textContent = 'bot確認を完了してから、もう一度お試しください。';
          return;
        }
        button.disabled = true;
        button.textContent = '送信中…';
        status.textContent = '';
        try {
          const response = await fetch('https://rondo.ando-seika.workers.dev/api/subscribe', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              email: data.get('email'),
              website: data.get('website'),
              cfToken,
              source: 'web',
            }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          form.reset();
          status.textContent = '確認メールを送りました。受信箱のリンクを開いて登録を完了してください。';
        } catch {
          status.textContent = '送信できませんでした。通信状態を確認し、bot確認をやり直してください。';
          if (window.turnstile) window.turnstile.reset();
        } finally {
          button.disabled = false;
          button.textContent = '登録確認メールを受け取る';
        }
      });
    })();
  </script>
</body>
</html>
